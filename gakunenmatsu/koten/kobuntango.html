<style>
/* チェックボックスを非表示にする */
.drawer_hidden {
  display: none;
}

/* ハンバーガーアイコンの設置スペース */
.drawer_open {
  display: flex;
  justify-content: center;
  align-items: center;
  position: fixed;
  top: 1em;
  left: 1em;
  z-index: 100;/* 重なり順を一番上にする */
  cursor: pointer;
}

/* ハンバーガーメニューのアイコン */
.drawer_open span,
.drawer_open span:before,
.drawer_open span:after {
  content: '';
  display: block;
  height: 3px;
  width: 25px;
  border-radius: 3px;
  background: #333;
  transition: 0.5s;
  position: absolute;
}

/* 三本線の一番上の棒の位置調整 */
.drawer_open span:before {
  bottom: 8px;
}

/* 三本線の一番下の棒の位置調整 */
.drawer_open span:after {
  top: 8px;
}

/* アイコンがクリックされたら真ん中の線を透明にする */
#drawer_input:checked ~ .drawer_open span {
  background: rgba(255, 255, 255, 0);
}

/* アイコンがクリックされたらアイコンが×印になように上下の線を回転 */
#drawer_input:checked ~ .drawer_open span::before {
  bottom: 0;
  transform: rotate(45deg);
}

#drawer_input:checked ~ .drawer_open span::after {
  top: 0;
  transform: rotate(-45deg);
}
/* メニューのデザイン*/
.nav_content {
  width: 100%;
  height: 100%;
  position: fixed;
  top: 0%;
  right: 100%; /* メニューを画面の外に飛ばす */
  z-index: 99;
  background: #99FFFF;
  transition: .5s;
  text-align: center;
  padding-top: 20px;
}

/* アイコンがクリックされたらメニューを表示 */
#drawer_input:checked ~ .nav_content {
  right: 0;
}
 
#toggle{
 display: none;
}
.lq, .la{
 font-family: sans-serif;
 font-size: 2em;
 background-color: #00000066;
 font-weight: bold;
 position: fixed;
 top: 0;
 left: 2em;
}
.lq{
 display: block;
 z-index: 6;
}
.la{
 display: none;
 z-index: 2;
}
img{
 width: 100vw;
}
.q{
 display: block;
 position: absolute;
 top: 0;
 left: 0;
 z-index: 5;
}
.a{
 display: none;
 position: absolute;
 top: 0;
 left: 0;
 z-index: 1;
}
#toggle:checked ~ .q{
 display: none;
}
#toggle:checked ~ .lq{
 display: none;
}
#toggle:checked ~ .a{
 display: block;
}
#toggle:checked ~ .la{
 display: block;
}
</style>
<!-- ハンバーガーメニュー部分 -->
<div class="nav">

  <!-- ハンバーガーメニューの表示・非表示を切り替えるチェックボックス -->
  <input id="drawer_input" class="drawer_hidden" type="checkbox">

  <!-- ハンバーガーアイコン -->
  <label for="drawer_input" class="drawer_open"><span></span></label>

  <!-- メニュー -->
  <nav class="nav_content">
    <ul class="nav_list">
      <li class="nav_item"><a href="">TOP</a></li>
      <li class="nav_item"><a href="">ABOUT</a></li>
      <li class="nav_item"><a href="">SERVICE</a></li>
    </ul>
  </nav>

</div>

<div class="b">
<input type="checkbox" id="toggle">
<label class="lq" for="toggle">答えを表示する</label>
<label class="la" for="toggle">答えを表示しない</label>
<div class="q">
<img src="https://moriwakiren-fucc.github.io/paper_scanner/gakunenmatsu/koten/kobuntango_q.JPEG">
</div>
<div class="a">
<img src="https://moriwakiren-fucc.github.io/paper_scanner/gakunenmatsu/koten/kobuntango_a.JPEG">
</div>
</div>
