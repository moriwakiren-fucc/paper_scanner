<style>
/* メニューのデザイン*/
.nav_content {
  width: 100%;
  height: 100%;
  position: fixed;
  top: 0%;
  right: 100%; /* メニューを画面の外に飛ばす */
  z-index: 99;
  background: rgb(110, 110, 110);
  transition: .5s;
  text-align: center;
  padding-top: 20px;
}

/* アイコンがクリックされたらメニューを表示 */
#drawer_input:checked ~ .nav_content {
  right: 0;
}
 
#toggle{
 display: none;
}
label{
 font-family: sans-serif;
 font-size: 2em;
 background-color: #00000066;
 font-weight: bold;
 position: fixed;
 top: 0;
 left: 0;
}
.lq{
 display: block;
 z-index: 6;
}
.la{
 display: none;
 z-index: 2;
}
img{
 width: 100vw;
}
.q{
 display: block;
 position: absolute;
 top: 0;
 left: 0;
 z-index: 5;
}
.a{
 display: none;
 position: absolute;
 top: 0;
 left: 0;
 z-index: 1;
}
input:checked ~ .q{
 display: none;
}
input:checked ~ .lq{
 display: none;
}
input:checked ~ .a{
 display: block;
}
input:checked ~ .la{
 display: block;
}
</style>
<!-- ハンバーガーメニュー部分 -->
<div class="nav">

  <!-- ハンバーガーメニューの表示・非表示を切り替えるチェックボックス -->
  <input id="drawer_input" class="drawer_hidden" type="checkbox">

  <!-- ハンバーガーアイコン -->
  <label for="drawer_input" class="drawer_open"><span>≡</span></label>

  <!-- メニュー -->
  <nav class="nav_content">
    <ul class="nav_list">
      <li class="nav_item"><a href="">TOP</a></li>
      <li class="nav_item"><a href="">ABOUT</a></li>
      <li class="nav_item"><a href="">SERVICE</a></li>
    </ul>
  </nav>

</div>

<div class="b">
<input type="checkbox" id="toggle">
<label class="lq" for="toggle">答えを表示する</label>
<label class="la" for="toggle">答えを表示しない</label>
<div class="q">
<img src="https://moriwakiren-fucc.github.io/paper_scanner/gakunenmatsu/koten/kobuntango_q.JPEG">
</div>
<div class="a">
<img src="https://moriwakiren-fucc.github.io/paper_scanner/gakunenmatsu/koten/kobuntango_a.JPEG">
</div>
</div>
