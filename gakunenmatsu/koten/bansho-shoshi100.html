<head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Klee+One&display=swap');
body{
 margin: 0;
 overflow: hidden;
 width: 100vw;
 height: 100vh;
}
.sec1{
 font-size: 1.3em;
 height: 95vh;
 width: 100vw;
 color: #FFFFFF;
 background-color: #1d5537;
 font-family: Klee One;
 writing-mode: vertical-rl;
 text-orientation: mixed;
 overflow: hidden;
 overflow-x: auto;
 -webkit-overflow-scrolling: touch;
}
.sec2{
 width: 100vw;
 height: 5vh;
 background-color:#c39143;
}
div{
 margin: 0 1em;
}
p{
 margin: 1em 0.5em;
 line-height: calc(1.7em + 4px);
}
.p1{
 padding-top: calc(2em + 4px);
 text-indent: calc(-2em - 4px);
}
.ju{
 font-weight: bold;
 color: #f4b4d0;
 border: solid 2px #f4b4d0;
 border-radius: 50%;
 margin-top: calc(-1em - 4px);
}
.do{
 font-weight: bold;
 color: #fff790;
 color: #9ed8f6;
 border: solid 2px #9ed8f6;
 border-radius: 50%;
 margin-top: calc(-1em - 4px);
}
</style>
<body>
<section class="sec1">
 <p>◎儒家の思想と道家の思想の異なる点と共通する点とは？</p>
 <div>
  <p>＜共通する点＞</p>
  <p class="p1">乱世を治めようとする点</p>
 </div>
 <div>
  <p>＜異なる点＞</p>
  <p class="p1">①乱世の原因<br>
  <span class="ju">儒</span>神器の道徳が失われたから<br>
  <span class="do">道</span>仁義などの人知があらわれたから</p>
  <p class="p1">②理想とする社会<br>
  <span class="ju">儒</span>周初の家族道徳をもとにした封建社会<br>
  <span class="do">道</span>太古のままの農村社会</p>
  <p class="p1">③乱世を救う方法<br>
  <span class="ju">儒</span>仁義の道徳を回復<br>
  <span class="do">道</span>人為的な道徳を否定する<br>
  自然にかえる</p>
 </div>
</section>
<section class="sec2">
</section>
</body>
