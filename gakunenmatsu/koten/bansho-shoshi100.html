<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>諸子百家（儒家と道家）　板書</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Klee+One&display=swap');
/* チェックボックスを非表示にする */
.drawer_hidden {
  display: none;
}

/* ハンバーガーアイコンの設置スペース */
.drawer_open {
  background-color:#FFFFFF99;
  display: flex;
  justify-content: center;
  align-items: center;
  position: fixed;
  top: 0;
  height: 3em;
  width: 3em;
  left: 0;
  z-index: 101;/* 重なり順を一番上にする */
  cursor: pointer;
}

/* ハンバーガーメニューのアイコン */
.drawer_open span,
.drawer_open span:before,
.drawer_open span:after {
  content: '';
  display: block;
  height: calc(3em / 8);
  width: calc(3em * 0.85);
  border-radius: calc(3em / 6);
  background: #333;
  transition: 0.5s;
  position: absolute;
  z-index:103;
}

/* 三本線の一番上の棒の位置調整 */
.drawer_open span:before {
  bottom: calc(3em / 4);
}

/* 三本線の一番下の棒の位置調整 */
.drawer_open span:after {
  top: calc(3em / 4);
}

/* アイコンがクリックされたら真ん中の線を透明にする */
#drawer_input:checked ~ .drawer_open span {
  background: rgba(255, 255, 255, 0);
}

/* アイコンがクリックされたらアイコンが×印になように上下の線を回転 */
#drawer_input:checked ~ .drawer_open span::before {
  bottom: 0;
  transform: rotate(45deg);
}

#drawer_input:checked ~ .drawer_open span::after {
  top: 0;
  transform: rotate(-45deg);
}
/* メニューのデザイン*/
.nav_content {
  width: 90%;
  height: 100%;
  position: fixed;
  top: 0%;
  left: -90%; /* メニューを画面の外に飛ばす */
  z-index: 99;
  background: #FFFFFF99;
  transition: .5s;
  text-align: center;
  padding-top: 20px;
  font-size: 1.5em;
  overflow: scroll;
  font-family: sans-serif;
}

.nav_list li{
  list-style: none; /* 点を消す */
  padding: 0;       /* 余白も消す（推奨） */
}

.nav_list li a{
  text-decoration: none;
  color: #0000FF;
}
  
/* アイコンがクリックされたらメニューを表示 */
#drawer_input:checked ~ .nav_content {
  left: 0;
}
 
body{
 margin: 0;
 overflow: hidden;
 width: 100vw;

}

.ju{

}
.do{

 border-radius: 50%;

}
</style>

 <p>◎儒家の思想と道家の思想の異なる点と共通する点とは？</p>
 <div>

 <div>

  <p class="p1">①乱世の原因<br>
  <span class="ju">儒</span>神器の道徳が失われたから<br>
  <span class="do">道</span>仁義などの人知があらわれたから</p>

  <span class="ju">儒</span>周初の家族道徳をもとにした封建社会<br>
  <span class="do">道</span>太古のままの農村社会</p>
  <p class="p1">③乱世を救う方法<br>
  <span class="ju">儒</span>仁義の道徳を回復<br>
  <span class="do">道</span>人為的な道徳を否定する<br>
  自然にかえる</p>
 </div>
