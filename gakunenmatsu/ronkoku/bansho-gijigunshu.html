<style>
body{
 margin: 0;
 overflow: hidden;
 width: 100vw;
 height: 100vh;
}
.sec1{
 font-size: 1.3em;
 height: 95vh;
 width: 100vw;
 color: #FFFFFF;
 background-color: #1d5537;
 font-family: Klee One;
 writing-mode: vertical-rl;
 text-orientation: mixed;
 overflow: hidden;
 overflow-x: auto;
 -webkit-overflow-scrolling: touch;
}
  
/* チェックボックスを非表示にする */
.drawer_hidden {
  display: none;
}

/* ハンバーガーアイコンの設置スペース */
.drawer_open {
  display: flex;
  justify-content: center;
  align-items: center;
  position: fixed;
  top: 1.3em;
  padding-left: 0 0 0 0.15em;
  left: 1.3em;
  z-index: 100;/* 重なり順を一番上にする */
  cursor: pointer;
}

/* ハンバーガーメニューのアイコン */
.drawer_open span,
.drawer_open span:before,
.drawer_open span:after {
  content: '';
  display: block;
  height: calc(1.5em / 8);
  width: 1.5em;
  border-radius: calc(1.5em / 8);
  background: #333;
  transition: 0.5s;
  position: absolute;
}

/* 三本線の一番上の棒の位置調整 */
.drawer_open span:before {
  bottom: calc(1.5em / 3);
}

/* 三本線の一番下の棒の位置調整 */
.drawer_open span:after {
  top: calc(1.5em / 3);
}

/* アイコンがクリックされたら真ん中の線を透明にする */
#drawer_input:checked ~ .drawer_open span {
  background: rgba(255, 255, 255, 0);
}

/* アイコンがクリックされたらアイコンが×印になように上下の線を回転 */
#drawer_input:checked ~ .drawer_open span::before {
  bottom: 0;
  transform: rotate(45deg);
}

#drawer_input:checked ~ .drawer_open span::after {
  top: 0;
  transform: rotate(-45deg);
}
/* メニューのデザイン*/
.nav_content {
  width: 90%;
  height: 100%;
  position: fixed;
  top: 0%;
  left: -90%; /* メニューを画面の外に飛ばす */
  z-index: 99;
  background: #99FFFF;
  transition: .5s;
  text-align: center;
  padding-top: 20px;
  font-size: 1.5em;
}

.nav_list li{
  list-style: none; /* 点を消す */
  padding: 0;       /* 余白も消す（推奨） */
}

/* アイコンがクリックされたらメニューを表示 */
#drawer_input:checked ~ .nav_content {
  left: 0;
}
 
img{
 height: 100vh;
}
</style>
<!-- ハンバーガーメニュー部分 -->
<div class="nav">

  <!-- ハンバーガーメニューの表示・非表示を切り替えるチェックボックス -->
  <input id="drawer_input" class="drawer_hidden" type="checkbox">

  <!-- ハンバーガーアイコン -->
  <label for="drawer_input" class="drawer_open"><span></span></label>

  <!-- メニュー -->
  <nav class="nav_content">
    <ul class="nav_list">
      <li class="nav_item"><a href="">TOP</a></li>
      <li class="nav_item"><a href="">ABOUT</a></li>
      <li class="nav_item"><a href="">SERVICE</a></li>
    </ul>
  </nav>

</div>
<section class="sec1">
  <img src="https://moriwakiren-fucc.github.io/paper_scanner/gakunenmatsu/ronkoku/bansho-gijigunshu.jpg">
</section>
